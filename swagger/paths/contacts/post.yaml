tags:
  - Contacts
summary: Create a contact
operationId: createContact
description: Create a new contact for the authenticated user.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - phoneNumber
          - email
        properties:
          name:
            type: string
          phoneNumber:
            type: string
          email:
            type: string
            format: email
          isFavourite:
            type: boolean
          contactType:
            type: string
          photo:
            type: string
            format: binary
responses:
  '201':
    description: Contact successfully created
  '400':
    description: Invalid request data
  '401':
    description: Unauthorized