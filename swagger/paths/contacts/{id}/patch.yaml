tags:
  - Contacts
summary: Update a contact
operationId: patchContact
description: Update an existing contact.
security:
  - bearerAuth: []
parameters:
  - in: path
    name: contactId
    required: true
    schema:
      type: string
    description: Contact ID
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
          phoneNumber:
            type: string
          email:
            type: string
            format: email
          isFavourite:
            type: boolean
          contactType:
            type: string
          photo:
            type: string
            format: binary
responses:
  '200':
    description: Contact successfully updated
  '400':
    description: Invalid request data
  '401':
    description: Unauthorized
  '404':
    description: Contact not found