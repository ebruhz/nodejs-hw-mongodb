Unauthorized:
  description: Authentication required or token is invalid
  content:
    application/json:
      schema:
        type: object
        properties:
          status:
            type: integer
            example: 401
          message:
            type: string
            example: Unauthorized

NotFound:
  description: Contact not found
  content:
    application/json:
      schema:
        type: object
        properties:
          status:
            type: integer
            example: 404
          message:
            type: string
            example: Contact not found

BadRequest:
  description: Invalid request data
  content:
    application/json:
      schema:
        type: object
        properties:
          status:
            type: integer
            example: 400
          message:
            type: string